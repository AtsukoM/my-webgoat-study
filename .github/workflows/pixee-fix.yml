name: "Pixee Auto Fix"

on:
  workflow_run:
    workflows: ["CodeQL"] # 先ほど作ったCodeQLワークフローの名前
    types:
      - completed

jobs:
  pixee-fix:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Pixee CLI
        run: pip install pixee

      - name: Download CodeQL Results (SARIF)
        uses: actions/download-artifact@v4
        with:
          name: java-sarif # CodeQLの設定により名前が異なる場合があります
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run Pixee Fix
        run: |
          # 全体に対して修正を試みる
          pixee fix . --sarif results.sarif
        env:
          PIXEE_API_KEY: ${{ secrets.PIXEE_TOKEN }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.PIXEE_TOKEN }}
          commit-message: "security: auto-fix vulnerabilities by Pixee"
          title: "🛡️ [Pixee] Security Vulnerability Fix"
          body: "This PR was automatically generated by Pixee CLI to fix vulnerabilities detected by CodeQL."
          branch: "pixee-fix-auto"
